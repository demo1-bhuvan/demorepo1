# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  ci:
    jobs:
      - install
      - lint:
          requires:
            - install
      - test:
          requires:
            - install
      - build:
          requires:
            - lint
            - test
