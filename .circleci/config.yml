version: 2.1

# ---------------------------------------------------------------------------
# Orbs
# ---------------------------------------------------------------------------
orbs:
  node: circleci/node@5

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:

  # ---------- Install ----------
  install:
    executor:
      name: node/default
      tag: "22.19"
    resource_class: medium
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - persist_to_workspace:
          root: .
          paths:
            - node_modules

  # ---------- Lint ----------
  lint:
    executor:
      name: node/default
      tag: "22.19"
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Lint
          # Replace with your lint command, e.g.: npm run lint
          command: echo "No lint command configured — add one here"

  # ---------- Test ----------
  test:
    executor:
      name: node/default
      tag: "22.19"
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run tests
          # Replace with your test command, e.g.: npm test
          command: echo "No test command configured — add one here"
      - store_test_results:
          path: test-results
      - store_artifacts:
          path: test-results

  # ---------- Build ----------
  build:
    executor:
      name: node/default
      tag: "22.19"
    resource_class: medium
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Build
          # Replace with your build command, e.g.: npm run build
          command: echo "No build command configured — add one here"
      - store_artifacts:
          path: dist

